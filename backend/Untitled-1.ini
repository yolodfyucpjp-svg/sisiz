Запустить проект просто – нужно открыть два терминала (в VS Code). Вот полные команды:

---

### 🧩 Бэкенд (FastAPI)

**Открой первый терминал** (`Ctrl + `` `) и выполни:

```powershell
cd D:\eco-trace-ai\backend
python -m uvicorn main:app --reload --port 8000
```

Должен появиться лог:  
`Uvicorn running on http://127.0.0.1:8000`

✅ **Не закрывай это окно!**

---

### 🎨 Фронтенд (React + Vite)

**Открой второй терминал** (нажми `+` в панели терминалов или `Ctrl + Shift + `` `) и выполни:

```powershell
cd D:\eco-trace-ai
npm run dev
```

Через пару секунд появится:  
`➜  Local:   http://localhost:5173/`

Открой браузер по этому адресу.

---

### 📊 Проверка загрузки Excel

Если хочешь протестировать загрузку Excel-файла:

1. Создай тестовый файл скриптом (один раз). В том же терминале, где бэкенд (он продолжает работать), выполни:
   ```powershell
   cd D:\eco-trace-ai\backend
   python create_test_data.py
   ```
   В папке `backend` появится `test_data.xlsx`.

2. На сайте нажми **«Выберите файл»** → выбери `test_data.xlsx` → **«Upload Excel & Analyze»**.  
   Дашборд обновится данными из Excel.

---

### 💡 Примечание

- Все необходимые библиотеки уже установлены (pandas, uvicorn, stripe и т.д.), а ошибки в коде исправлены.
- Если бэкенд не запускается – проверь, что в терминале выбран **настоящий Python** (не заглушка), это уже было исправлено.

Теперь проект полностью работоспособен. Если хочешь двигаться дальше – улучшать дизайн, подключать Stripe или деплоить, скажи!